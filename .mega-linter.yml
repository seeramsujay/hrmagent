---
VALIDATE_ALL_CODEBASE: false
FILTER_REGEX_EXCLUDE: (data/|outputs/|grammars/|examples/)
DISABLE:
  - COPYPASTE
  - SPELL
DISABLE_LINTERS:
  - PYTHON_MYPY
  - PYTHON_PYRIGHT
  - PYTHON_BANDIT
  - PYTHON_PYLINT
  - YAML_PRETTIER
  - YAML_V8R
  - JSON_PRETTIER
  - JSON_BIOME
  - BIOME_FORMAT
  - ACTION_ZIZMOR
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: (.github/workflows)
YAML_V8R_FILTER_REGEX_EXCLUDE: (.github/workflows)
