[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hrm-agent"
version = "0.1.0"
description = "Production-grade Local-First Hierarchical Reasoning Model (HRM) Competitive Programming Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "DeepMind HRM Team", email = "research@deepmind.local" }
]
dependencies = [
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "duckdb>=0.10.0",
    "datasets>=2.18.0",
    "llama-cpp-python>=0.2.70",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "liger-kernel>=0.1.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.scripts]
hrm = "hrm_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
