# Configuration for Hierarchical Reasoning Model (HRM) Runtime
topology: "option_a" # "option_a" (Three Resident Models) or "option_b" (Hybrid: 0.5B Coder + Shared 1.5B Base with LoRA)

option_a:
  node1_planner:
    model_path: "models/gguf/DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
    context_length: 2048
    type_k: "q8_0"
    type_v: "q8_0"
    temperature: 0.2
    top_p: 0.95
    max_tokens: 300
    grammar_file: "grammars/planner.gbnf"
  node2_coder:
    model_path: "models/gguf/Qwen2.5-Coder-0.5B-Instruct-Q5_K_M.gguf"
    context_length: 2048
    type_k: "q8_0"
    type_v: "q8_0"
    temperature: 0.6
    top_p: 0.90
    max_tokens: 1024
    plan_to_code_grammar: "grammars/cpp_raw.gbnf"
    error_to_diff_grammar: "grammars/unified_diff.gbnf"
  node3_critic:
    model_path: "models/gguf/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
    context_length: 2048
    type_k: "q8_0"
    type_v: "q8_0"
    temperature: 0.1
    top_p: 0.90
    max_tokens: 350
    grammar_file: "grammars/critic.gbnf"

option_b:
  node2_coder:
    model_path: "models/gguf/Qwen2.5-Coder-0.5B-Instruct-Q5_K_M.gguf"
    context_length: 2048
    type_k: "q8_0"
    type_v: "q8_0"
    temperature: 0.6
    top_p: 0.90
    max_tokens: 1024
  shared_1_5b_base:
    model_path: "models/gguf/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
    context_length: 2048
    type_k: "q8_0"
    type_v: "q8_0"
    planner_lora: "models/loras/planner_1.5b.bin"
    critic_lora: "models/loras/critic_1.5b.bin"

cpu_affinity:
  enabled: true
  p_cores: [0, 1, 2, 3, 4, 5, 6, 7]
  e_cores: [8, 9, 10, 11]
  llm_threads: 8
  llm_taskset: "0-7"
  sandbox_taskset: "8-11"

scaling:
  n_plans: 1
  n_candidates: 3
  max_inner_iters: 3
  max_critic_iters: 2
  max_planner_escalations: 1
